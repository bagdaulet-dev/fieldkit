# Activate with mysql,production. Startup refuses insecure overrides.
fieldkit.secure-cookies=true
fieldkit.demo-enabled=false
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fieldkit}?connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=10000&sslMode=VERIFY_IDENTITY
