spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fieldkit}?connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=10000&sslMode=${MYSQL_SSL_MODE:REQUIRED}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
