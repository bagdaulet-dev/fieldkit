spring.application.name=Fieldkit
spring.profiles.default=preview
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8082}
server.servlet.session.timeout=7d
server.error.include-message=never
server.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
server.max-http-request-header-size=8KB
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.tomcat.threads.max=30
server.tomcat.max-connections=150
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.session.jdbc.initialize-schema=never
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
fieldkit.time-zone=${APP_TIME_ZONE:Asia/Almaty}
fieldkit.secure-cookies=${SECURE_COOKIES:false}
fieldkit.demo-enabled=${DEMO_ENABLED:true}
logging.level.root=WARN
logging.level.liquibase=ERROR
spring.main.banner-mode=off

debug=false
spring.liquibase.database-change-log-table=databasechangelog
spring.liquibase.database-change-log-lock-table=databasechangeloglock

# Only a controlled proxy may explicitly enable forwarded headers.
server.forward-headers-strategy=none
server.servlet.session.tracking-modes=cookie
server.tomcat.accesslog.enabled=false
server.servlet.session.cookie.http-only=true
spring.h2.console.enabled=false
