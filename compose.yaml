name: fieldkit
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fieldkit}
      MYSQL_USER: ${MYSQL_USER:-fieldkit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/setup-env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 scripts/setup-env.py}
    volumes: ["mysql-data:/var/lib/mysql"]
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
        "--innodb-buffer-pool-size=128M",
        "--max-connections=50",
      ]
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fieldkit}
      MYSQL_USER: ${MYSQL_USER:-fieldkit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/setup-env.py}
      MYSQL_SSL_MODE: ${MYSQL_SSL_MODE:-DISABLED}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Almaty}
    ports: ["127.0.0.1:${APP_PORT:-8082}:8080"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=96m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped
volumes:
  mysql-data:
